  <!-- Preload font Be Vietnam Pro tiếng Việt -->

  <link rel="preload" href="vendor/fonts/be-vietnam-pro-vietnamese-800-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Bắt lỗi trước khi bất kỳ module nào chạy -->
  <script>
    window.addEventListener('error', function(e) {
      if (!e.message && e.target && e.target !== window) return;
      var msg = 'LỖI: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
      fetch('/__loi?msg=' + encodeURIComponent(msg)).catch(function(){});
      var el = document.getElementById('loi');
      if (el) {
        el.style.display = 'block';
        el.textContent = msg;
      }
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      var msg = 'LỖI PROMISE: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason));
      fetch('/__loi?msg=' + encodeURIComponent(msg)).catch(function(){});
      var el = document.getElementById('loi');
      if (el) {
        el.style.display = 'block';
        el.textContent = msg;
      }
    });
  </script>


  <div id="san_khau">
    <!-- Vùng render 3D Three.js -->
    <div id="canh_3d"></div>

    <!-- Lớp giao diện 2D -->

        </nav>
        <button class="nut_vien_thuoc tuong_tac" id="btn_n101b">N1-01B</button>
      </header>

      <!-- Nội dung chính (Cột trái) -->
      <main id="noi_dung_chinh">
        <div id="cot_trai">
          <!-- Nội dung động do deck.js chèn vào -->
          <div class="dong_muc" id="slide_muc"></div>
          <h1 class="tieu_de_slide" id="slide_tieu_de"></h1>

      <!-- Thanh dưới -->
      <footer id="thanh_duoi">

        <div class="tien_trinh_vien_thuoc tuong_tac" id="tien_trinh_vien_thuoc">

        </div>

    <!-- Màn hình phủ lỗi -->
